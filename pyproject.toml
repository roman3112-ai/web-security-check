[project]
name = "web-security-check"
version = "0.1.0"
description = "Non-destructive checker for HTTP security headers and cookie flags."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.scripts]
websec = "websec.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
